name: Circle Base Sepolia faucet

on:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-usdc:
    runs-on: ubuntu-latest
    steps:
      - name: Request Base Sepolia USDC
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          TARGET_ADDRESS: "0x38e9845A1Df22c59Bfc693bf2CEAa3361158d6d1"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CIRCLE_API_KEY:-}" ]; then
            echo "CIRCLE_API_KEY is not configured"
            exit 1
          fi
          payload=$(printf '{"address":"%s","blockchain":"BASE-SEPOLIA","usdc":true}' "$TARGET_ADDRESS")
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST "https://api.circle.com/v1/faucet/drips" \
            --header "Authorization: Bearer $CIRCLE_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload")
          echo "Circle faucet HTTP status: $status"
          case "$status" in
            2??) echo "Circle faucet request accepted." ;;
            *) echo "Circle faucet request failed."; exit 1 ;;
          esac
