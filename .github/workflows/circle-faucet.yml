name: Derive test wallet public address

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive-address:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare address derivation tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wallet-derive
          cd /tmp/wallet-derive
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund ethers@6.15.0 >/dev/null 2>&1

      - name: Derive public address
        env:
          PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "TEST_WALLET_PRIVATE_KEY is not configured"
            exit 1
          fi
          cd /tmp/wallet-derive
          node -e "const {Wallet}=require('ethers'); console.log('PUBLIC_ADDRESS='+new Wallet(process.env.PRIVATE_KEY).address)"
