name: Verify GuaranteeTrust live state

on:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read Base Sepolia GuaranteeTrust state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gt-verify
          cd /tmp/gt-verify
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund ethers@6 >/dev/null 2>&1
          node -e "const {JsonRpcProvider,Contract}=require('ethers'); (async()=>{const p=new JsonRpcProvider('https://sepolia.base.org'); const gt=new Contract('0x0B1dd81598989B199B802510499c22caAd60dd4C',['function reserve() view returns(uint256)','function outstanding() view returns(uint256)','function totalStake() view returns(uint256)','function totalDues() view returns(uint256)','function sponsorCapital() view returns(uint256)','function token() view returns(address)'],p); const token=new Contract('0x86fF3d60bE81B1531eCC5c756C519B97c382C047',['function balanceOf(address) view returns(uint256)','function totalSupply() view returns(uint256)'],p); const [r,o,s,d,c,t,b,supply,block]=await Promise.all([gt.reserve(),gt.outstanding(),gt.totalStake(),gt.totalDues(),gt.sponsorCapital(),gt.token(),token.balanceOf(await gt.getAddress()),token.totalSupply(),p.getBlockNumber()]); console.log('block='+block); console.log('token='+t); console.log('reserve='+r); console.log('outstanding='+o); console.log('totalStake='+s); console.log('totalDues='+d); console.log('sponsorCapital='+c); console.log('tokenBalance='+b); console.log('tokenSupply='+supply); console.log('identity_token='+(b===r+s)); console.log('identity_reserve='+(r===c+d)); console.log('nonzero_state='+([r,o,s,d,c,b,supply].some(x=>x!==0n)));})().catch(e=>{console.error(e.message);process.exit(1)})"
