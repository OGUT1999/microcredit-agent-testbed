name: Circle Base Sepolia faucet

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"

permissions:
  contents: read

jobs:
  derive-address:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Derive ChatGPT wallet address')
    runs-on: ubuntu-latest
    steps:
      - name: Derive public address
        env:
          PRIVATE_KEY: ${{ secrets.TEST_WALLET_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_KEY:-}" ]; then
            echo "TEST_WALLET_PRIVATE_KEY is not configured"
            exit 1
          fi
          mkdir -p /tmp/wallet-derive
          cd /tmp/wallet-derive
          npm init -y >/dev/null 2>&1
          npm install ethers@6 >/dev/null 2>&1
          node -e "const {Wallet}=require('ethers'); console.log('PUBLIC_ADDRESS='+new Wallet(process.env.PRIVATE_KEY).address)"
