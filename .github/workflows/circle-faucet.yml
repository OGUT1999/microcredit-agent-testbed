name: Check Sepolia ETH gas

on:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"

permissions:
  contents: read

jobs:
  check-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Read Ethereum Sepolia ETH balance
        shell: bash
        run: |
          set -euo pipefail
          curl -sS https://ethereum-sepolia-rpc.publicnode.com -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBalance","params":["0x38e9845A1Df22c59Bfc693bf2CEAa3361158d6d1","latest"]}' > /tmp/eth.json
          node -e "const r=require('/tmp/eth.json'); console.log('SEPOLIA_ETH_WEI='+BigInt(r.result).toString()); console.log('SEPOLIA_ETH='+Number(BigInt(r.result))/1e18)"
