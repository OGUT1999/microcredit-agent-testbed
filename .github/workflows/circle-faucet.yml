name: Circle Base Sepolia faucet

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"

permissions:
  contents: read

jobs:
  request-usdc:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Request Circle faucet')
    runs-on: ubuntu-latest
    steps:
      - name: Request testnet USDC
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          TARGET_ADDRESS: "0x5e4dC7639D2b94006c51aD5373173f5e01c248F9"
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CIRCLE_API_KEY:-}" ]; then
            echo "CIRCLE_API_KEY is not configured"
            exit 1
          fi

          payload=$(printf '{"address":"%s","blockchain":"BASE-SEPOLIA","usdc":true}' "$TARGET_ADDRESS")
          status=$(curl --silent --show-error             --output /tmp/circle-response.json             --write-out "%{http_code}"             --request POST "https://api.circle.com/v1/faucet/drips"             --header "Authorization: Bearer $CIRCLE_API_KEY"             --header "Content-Type: application/json"             --data "$payload")

          echo "Circle faucet HTTP status: $status"
          if [[ "$status" =~ ^2 ]]; then
            echo "Circle faucet request accepted for Base Sepolia USDC."
          else
            echo "Circle faucet request failed."
            if [ -s /tmp/circle-response.json ]; then
              python - <<'PY'
import json
p="/tmp/circle-response.json"
try:
    data=json.load(open(p))
    safe={k:v for k,v in data.items() if k.lower() not in {"token","api_key","apikey","authorization"}}
    print(json.dumps(safe, indent=2)[:4000])
except Exception:
    print("Circle returned a non-JSON error response.")
PY
            fi
            exit 1
          fi
