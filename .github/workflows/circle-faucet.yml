name: Check ChatGPT test wallet balances

on:
  push:
    paths:
      - ".github/workflows/circle-faucet.yml"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Read Sepolia balances
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wallet-balance
          cd /tmp/wallet-balance
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund ethers@6 >/dev/null 2>&1
          cat > check.mjs <<'NODE'
          import { JsonRpcProvider, Contract, formatEther, formatUnits } from 'ethers';
          const addr='0x38e9845A1Df22c59Bfc693bf2CEAa3361158d6d1';
          const erc20=['function balanceOf(address) view returns(uint256)','function decimals() view returns(uint8)','function symbol() view returns(string)'];
          async function chain(label,rpc,tokens){
            const p=new JsonRpcProvider(rpc);
            const eth=await p.getBalance(addr);
            console.log(label+'_ETH='+formatEther(eth));
            console.log(label+'_BLOCK='+await p.getBlockNumber());
            for(const [name,a] of tokens){
              try{
                const c=new Contract(a,erc20,p);
                const [b,d,s]=await Promise.all([c.balanceOf(addr),c.decimals(),c.symbol()]);
                console.log(label+'_'+name+'='+formatUnits(b,d)+' '+s);
              }catch(e){
                console.log(label+'_'+name+'=unavailable');
              }
            }
          }
          await chain('ETHEREUM_SEPOLIA','https://ethereum-sepolia-rpc.publicnode.com',[
            ['CIRCLE_USDC','0x1c7d4b196cb0c7b01d743fbc6116a902379c7238']
          ]);
          await chain('BASE_SEPOLIA','https://sepolia.base.org',[
            ['CIRCLE_USDC','0x036CbD53842c5426634e7929541eC2318f3dCF7'],
            ['GUARANTEETRUST_TOKEN','0x86fF3d60bE81B1531eCC5c756C519B97c382C047']
          ]);
          NODE
          node check.mjs
